[package]
name = "claude-carousel"
version = "0.1.0"
description = "Reminds you about Claude sessions waiting for your reply"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tauri-plugin-global-shortcut = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
