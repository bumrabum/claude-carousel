<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Carousel</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="card" class="card" aria-live="polite">
      <header class="meta">
        <span id="source" class="badge"></span>
        <span id="where" class="where"></span>
        <span class="spacer"></span>
        <button id="prev" class="icon" title="Previous (←)" aria-label="Previous">‹</button>
        <span id="counter" class="counter"></span>
        <button id="next" class="icon" title="Next (→)" aria-label="Next">›</button>
        <button id="close" class="icon" title="Hide (Esc)" aria-label="Hide">×</button>
      </header>
      <div id="body" class="body">
        <h1 id="title" class="title"></h1>
        <p id="summary" class="summary"></p>
      </div>
      <footer class="actions">
        <button id="open" class="primary">Open</button>
        <button id="later">Later</button>
        <button id="done">Done</button>
      </footer>
    </main>
  </body>
</html>
