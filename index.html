<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Carousel</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="card" class="card" aria-live="polite">
      <div class="top">
        <button id="prev" class="rail" title="Previous (←)" aria-label="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>

        <div class="content">
          <header class="meta">
            <span id="source" class="badge"></span>
            <span id="waiting" class="waiting" title="Claude answered and waits for you">● Waiting</span>
            <span id="where" class="where"></span>
            <span class="spacer"></span>
            <button id="close" class="close" title="Hide (Esc)" aria-label="Hide">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </header>
          <div id="body" class="body">
            <h1 id="step" class="step"></h1>
            <p id="stopped" class="stopped"></p>
            <p id="title" class="title"></p>
          </div>
          <div id="dots" class="dots"></div>
        </div>

        <button id="next" class="rail" title="Next (→)" aria-label="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
      </div>

      <footer class="actions">
        <button id="open" class="primary" title="Open the session (Enter)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>
          Open
        </button>
        <button id="later" title="Hide for 1 hour">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>
          Later
        </button>
        <button id="dont-remind" title="Hide until something new happens in this session">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 19a2.5 2.5 0 0 0 5 0M4 4l16 16M8.5 5.2A6 6 0 0 1 18 10c0 3.5 1 5.5 2 6.5h-3.5M6.3 8.2A6 6 0 0 0 6 10c0 3.5-1 5.5-2 6.5h9" /></svg>
          Don't remind
        </button>
        <button id="retry" title="Try making next steps again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg>
          Retry
        </button>
      </footer>
    </main>
  </body>
</html>
